<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drone Telemetry</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #111;
      color: #fff;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .telemetry {
      padding: 20px;
      background-color: #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
    }
    .telemetry div {
      margin: 10px;
      padding: 10px 20px;
      background-color: #333;
      border-radius: 10px;
    }
    .alert-button {
      background-color: red;
      color: white;
      padding: 15px 30px;
      border: none;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
    }
    .map {
      flex: 1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    a {
      text-decoration: none;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="telemetry">
      <div><span id="speed">Speed: 0 km/h</span></div>
      <div><span id="height">Height: 0 m</span></div>
      <div><span id="battery">Battery: 88%</span></div>
      <div><span id="gps">GPS Satellite: 4</span></div>
      <button class="alert-button" onclick="alert('EMERGENCY STOP INITIATED!')">
        <a href="in.html">STOP ALERT</a>
      </button>
    </div>
    <div class="map">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d821.1336033519873!2d21.400317817222966!3d50.047008193360156!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1spl!2spl!4v1744608093500!5m2!1spl!2spl"
        allowfullscreen
        loading="lazy">
      </iframe>
    </div>
  </div>

  <script src="script.js" async defer></script>
</body>
</html>
